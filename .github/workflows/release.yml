name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Plan, open a version PR, publish prepared versions, or audit npm trust
        required: true
        default: plan
        type: choice
        options:
          - plan
          - prepare
          - publish
          - publish-unpublished
          - oidc-audit
      dry-run:
        description: Preview publish/recovery without uploads or metadata writes
        default: false
        type: boolean
      source-sha:
        description: Original full main commit to recover (publish modes only)
        type: string
      package:
        description: Exact package for publish-unpublished recovery
        type: string
      version:
        description: Exact version for publish-unpublished recovery
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

# All releases of this package share one durable repoctl checkpoint namespace.
concurrency:
  group: apple-app-factory-release
  cancel-in-progress: false

jobs:
  # Resolves the release mode for both triggers:
  # - workflow_dispatch: the owner-picked mode is validated as before.
  # - push to main: automatic. Pending changesets mean a feature PR just merged, so
  #   prepare a version PR; no pending changesets but an unpublished version mean the
  #   version PR just merged, so publish; otherwise skip.
  resolve:
    name: Resolve release mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout release source
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry-run }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
              echo '::error::Dispatch releases from main; use source-sha for original-source recovery.'
              exit 1
            fi
            case "$MODE" in
              plan|prepare|oidc-audit)
                if [ "$DRY_RUN" = 'true' ] || [ -n "$SOURCE_SHA$PACKAGE$VERSION" ]; then
                  echo '::error::Recovery and dry-run inputs are only valid for publish modes.'
                  exit 1
                fi
                ;;
              publish)
                if [ -n "$PACKAGE$VERSION" ]; then
                  echo '::error::Package/version selectors require publish-unpublished mode.'
                  exit 1
                fi
                ;;
              publish-unpublished)
                if [ -z "$PACKAGE" ] || [ -z "$VERSION" ]; then
                  echo '::error::publish-unpublished requires an exact package and version.'
                  exit 1
                fi
                ;;
              *) exit 1 ;;
            esac
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Automatic mode on push to main.
          pending=0
          for file in .changeset/*.md; do
            [ -e "$file" ] || continue
            case "$file" in
              */README.md) continue ;;
            esac
            pending=$((pending + 1))
          done
          if [ "$pending" -gt 0 ]; then
            echo "mode=prepare" >> "$GITHUB_OUTPUT"
            echo "::notice::$pending pending changeset(s) on main; preparing a version PR"
            exit 0
          fi
          version=$(node -p "require('./packages/apple-app-factory/package.json').version")
          published=$(npm view apphx version --registry=https://registry.npmjs.org 2>/dev/null || true)
          if [ -n "$published" ] && [ "$version" != "$published" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "::notice::apphx $version is not on npm (latest: $published); publishing"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::no pending changesets and apphx $version already published; nothing to do"
          fi

  plan:
    name: Review native version plan
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'plan' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec repoctl config validate --json
      - name: Summarize pending versions
        run: pnpm exec repoctl release plan --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Prepare or publish stable release
    needs: resolve
    if: ${{ contains(fromJSON('["prepare", "publish", "publish-unpublished"]'), needs.resolve.outputs.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Validate optional GitHub App credentials
        if: ${{ needs.resolve.outputs.mode == 'prepare' }}
        env:
          APP_CLIENT_ID: ${{ vars.REPOCTL_APP_CLIENT_ID }}
          APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.REPOCTL_APP_PRIVATE_KEY != '' }}
        run: |
          if { [ -n "$APP_CLIENT_ID" ] && [ "$APP_PRIVATE_KEY_CONFIGURED" != 'true' ]; } ||
             { [ -z "$APP_CLIENT_ID" ] && [ "$APP_PRIVATE_KEY_CONFIGURED" = 'true' ]; }; then
            echo '::error::Configure both REPOCTL_APP_CLIENT_ID and REPOCTL_APP_PRIVATE_KEY.'
            exit 1
          fi
      - name: Create preparation token
        if: ${{ needs.resolve.outputs.mode == 'prepare' && vars.REPOCTL_APP_CLIENT_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REPOCTL_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOCTL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          # Native preparation pushes its version PR branch; publication uses GitHub APIs.
          persist-credentials: ${{ needs.resolve.outputs.mode == 'prepare' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Require clean committed source
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo '::error::Release source must be clean after the frozen install.'
            git status --short
            exit 1
          fi
      - run: pnpm exec repoctl config validate --json
      - name: Execute native release gates and operation
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
          npm_config_registry: https://registry.npmjs.org
          REPO_RELEASE_MODE: ${{ needs.resolve.outputs.mode }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
        # repoctl owns quality gates, native pnpm versioning, PRs, uploads and recovery.
        # It isolates source-sha itself; never replace GITHUB_SHA with the historical SHA.
        run: pnpm exec repoctl release ci
      - name: Preserve release diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publish-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pnpm-publish-summary.json
            repoctl-publish-progress.json
            repoctl-release-progress.json
            repoctl-ci-progress.json
          if-no-files-found: ignore
          retention-days: 14

  oidc-audit:
    name: Audit npm trusted publisher
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'oidc-audit' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec repoctl release ci --mode=oidc-audit
